<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashMind – AI Flashcard Maker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap');

  :root {
    --bg: #0d0d0f;
    --surface: #18181c;
    --surface2: #222228;
    --border: #2e2e38;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --text: #f0f0f5;
    --muted: #888899;
    --card-front: #1e1e2a;
    --card-back: #1a2330;
    --green: #34d399;
    --red: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: grid; place-items: center;
    font-size: 18px;
  }

  header h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    letter-spacing: -0.3px;
  }

  header span { color: var(--accent2); font-style: italic; }

  .badge {
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--muted);
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 380px 1fr;
    height: calc(100vh - 65px);
  }

  /* ── LEFT PANEL ── */
  .panel-left {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-section {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .panel-section label {
    display: block;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 600;
  }

  textarea, input[type="text"], select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
    resize: none;
    transition: border-color 0.2s;
  }

  textarea:focus, input[type="text"]:focus, select:focus {
    border-color: var(--accent);
  }

  textarea { height: 130px; line-height: 1.6; }

  select option { background: var(--surface2); }

  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  .number-input {
    display: flex;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .number-input button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    padding: 10px 14px;
    cursor: pointer;
    transition: color 0.2s;
  }

  .number-input button:hover { color: var(--text); }

  .number-input span {
    flex: 1;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .btn-generate {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-generate:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

  /* deck list */
  .deck-list {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .deck-list::-webkit-scrollbar { width: 4px; }
  .deck-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .deck-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .deck-item:hover, .deck-item.active {
    border-color: var(--accent);
    background: #1e1b35;
  }

  .deck-name { font-size: 13px; font-weight: 600; }
  .deck-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .deck-count {
    background: var(--accent);
    color: #fff;
    border-radius: 20px;
    padding: 2px 9px;
    font-size: 11px;
    font-weight: 700;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
  }

  /* ── RIGHT PANEL ── */
  .panel-right {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .study-header {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .study-header h2 {
    font-family: 'Instrument Serif', serif;
    font-size: 18px;
  }

  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s;
  }

  .progress-text { font-size: 13px; color: var(--muted); white-space: nowrap; }

  .study-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    overflow-y: auto;
  }

  /* flashcard */
  .card-container {
    perspective: 1200px;
    width: 100%;
    max-width: 560px;
    height: 300px;
    cursor: pointer;
    margin-bottom: 28px;
  }

  .card-inner {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(.4,0,.2,1);
  }

  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    backface-visibility: hidden;
    text-align: center;
    border: 1px solid var(--border);
  }

  .card-front {
    background: var(--card-front);
    border-top: 3px solid var(--accent);
  }

  .card-back {
    background: var(--card-back);
    border-top: 3px solid var(--green);
    transform: rotateY(180deg);
  }

  .card-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    font-weight: 600;
  }

  .card-text {
    font-family: 'Instrument Serif', serif;
    font-size: 24px;
    line-height: 1.4;
    color: var(--text);
  }

  .card-hint {
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
  }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .btn-ctrl {
    padding: 11px 28px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-ctrl:hover { background: var(--surface); }
  .btn-ctrl.correct { border-color: var(--green); color: var(--green); }
  .btn-ctrl.correct:hover { background: #0d2420; }
  .btn-ctrl.wrong { border-color: var(--red); color: var(--red); }
  .btn-ctrl.wrong:hover { background: #2a1010; }
  .btn-ctrl:disabled { opacity: 0.35; cursor: not-allowed; }

  .flip-hint {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  kbd {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    font-family: inherit;
  }

  /* score bar */
  .score-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    align-items: center;
  }

  .score-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .score-pill.g { color: var(--green); }
  .score-pill.r { color: var(--red); }

  /* done state */
  .done-screen {
    text-align: center;
  }

  .done-screen .big-emoji { font-size: 64px; margin-bottom: 16px; }

  .done-screen h3 {
    font-family: 'Instrument Serif', serif;
    font-size: 28px;
    margin-bottom: 8px;
  }

  .done-screen p { color: var(--muted); margin-bottom: 24px; }

  .no-deck-msg {
    text-align: center;
    color: var(--muted);
    line-height: 2;
    font-size: 14px;
  }

  .no-deck-msg .big { font-size: 48px; margin-bottom: 8px; }

  /* loading overlay */
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    color: var(--text);
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<header>
  <div class="logo-icon">⚡</div>
  <h1>Flash<span>Mind</span></h1>
  <div class="badge">AI-Powered</div>
</header>

<main>
  <!-- LEFT: Generator -->
  <div class="panel-left">
    <div class="panel-section">
      <label>📝 Topic / Paste Content</label>
      <textarea id="topicInput" placeholder="e.g. 'Photosynthesis', 'JavaScript Promises', or paste notes/text here..."></textarea>
    </div>

    <div class="panel-section">
      <div class="row">
        <div>
          <label>🃏 Card Count</label>
          <div class="number-input">
            <button onclick="changeCount(-1)">−</button>
            <span id="countDisplay">5</span>
            <button onclick="changeCount(1)">+</button>
          </div>
        </div>
        <div>
          <label>🌐 Language</label>
          <select id="langSelect">
            <option value="English">English</option>
            <option value="Urdu">اردو</option>
            <option value="Roman Urdu">Roman Urdu</option>
            <option value="Arabic">Arabic</option>
            <option value="French">French</option>
            <option value="Spanish">Spanish</option>
            <option value="German">German</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <label>🎯 Difficulty</label>
      <select id="diffSelect">
        <option value="beginner">Beginner – Simple & clear</option>
        <option value="intermediate" selected>Intermediate – Balanced</option>
        <option value="advanced">Advanced – Deep dive</option>
      </select>
    </div>

    <div class="panel-section">
      <label>Deck Name (optional)</label>
      <input type="text" id="deckName" placeholder="e.g. Bio Chapter 3">
    </div>

    <div class="panel-section">
      <button class="btn-generate" id="genBtn" onclick="generateCards()">
        <span>⚡ Generate Flashcards</span>
      </button>
    </div>

    <div class="deck-list" id="deckList">
      <div class="empty-state">No decks yet.<br>Generate your first flashcards above! 🎉</div>
    </div>
  </div>

  <!-- RIGHT: Study Area -->
  <div class="panel-right">
    <div class="study-header">
      <h2 id="studyTitle">Study Mode</h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <span class="progress-text" id="progressText">0 / 0</span>
    </div>

    <div class="study-area" id="studyArea">
      <div class="no-deck-msg">
        <div class="big">🧠</div>
        Generate a deck from the left panel<br>and start studying instantly!
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  let cardCount = 5;
  let decks = [];
  let currentDeckIdx = -1;
  let currentCardIdx = 0;
  let isFlipped = false;
  let score = { correct: 0, wrong: 0 };

  function changeCount(d) {
    cardCount = Math.min(20, Math.max(1, cardCount + d));
    document.getElementById('countDisplay').textContent = cardCount;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  async function generateCards() {
    const topic = document.getElementById('topicInput').value.trim();
    if (!topic) { showToast('⚠️ Please enter a topic or paste some content!'); return; }

    const lang = document.getElementById('langSelect').value;
    const diff = document.getElementById('diffSelect').value;
    const name = document.getElementById('deckName').value.trim() || topic.slice(0, 30);

    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Generating...';

    const prompt = `You are a flashcard generation expert. Create exactly ${cardCount} flashcards about: "${topic}".

Difficulty: ${diff}
Language: ${lang}

Rules:
- Each flashcard has a clear QUESTION on the front and a concise ANSWER on the back
- Questions should be specific and testable
- Answers should be clear and not too long (1-3 sentences max)
- If the language is Urdu or Arabic, use that script
- If Roman Urdu, write phonetically in English letters

Respond ONLY with a valid JSON array, no markdown, no backticks, no explanation:
[
  {"q": "question here", "a": "answer here"},
  ...
]`;

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }]
        })
      });

      const data = await res.json();
      const raw = data.content.map(b => b.text || '').join('');
      const clean = raw.replace(/```json|```/g, '').trim();
      const cards = JSON.parse(clean);

      if (!Array.isArray(cards) || cards.length === 0) throw new Error('Invalid response');

      const deck = { name, cards, created: new Date().toLocaleTimeString() };
      decks.unshift(deck);
      renderDeckList();
      loadDeck(0);
      showToast(`✅ ${cards.length} flashcards created!`);
    } catch (e) {
      console.error(e);
      showToast('❌ Something went wrong. Try again!');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span>⚡ Generate Flashcards</span>';
    }
  }

  function renderDeckList() {
    const list = document.getElementById('deckList');
    if (decks.length === 0) {
      list.innerHTML = '<div class="empty-state">No decks yet.<br>Generate your first flashcards above! 🎉</div>';
      return;
    }
    list.innerHTML = decks.map((d, i) => `
      <div class="deck-item ${i === currentDeckIdx ? 'active' : ''}" onclick="loadDeck(${i})">
        <div>
          <div class="deck-name">${d.name}</div>
          <div class="deck-meta">${d.created}</div>
        </div>
        <div class="deck-count">${d.cards.length}</div>
      </div>
    `).join('');
  }

  function loadDeck(idx) {
    currentDeckIdx = idx;
    currentCardIdx = 0;
    isFlipped = false;
    score = { correct: 0, wrong: 0 };
    renderDeckList();
    renderStudy();
    document.getElementById('studyTitle').textContent = decks[idx].name;
  }

  function renderStudy() {
    const deck = decks[currentDeckIdx];
    if (!deck) return;

    const total = deck.cards.length;
    const done = score.correct + score.wrong;
    document.getElementById('progressFill').style.width = (done / total * 100) + '%';
    document.getElementById('progressText').textContent = `${done} / ${total}`;

    const area = document.getElementById('studyArea');

    if (currentCardIdx >= total) {
      const pct = Math.round(score.correct / total * 100);
      area.innerHTML = `
        <div class="done-screen">
          <div class="big-emoji">${pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '💪'}</div>
          <h3>${pct >= 80 ? 'Excellent!' : pct >= 50 ? 'Good job!' : 'Keep practicing!'}</h3>
          <p>${score.correct} correct · ${score.wrong} wrong · ${pct}% accuracy</p>
          <div style="display:flex;gap:10px;justify-content:center">
            <button class="btn-ctrl" onclick="loadDeck(${currentDeckIdx})">🔄 Restart Deck</button>
            <button class="btn-ctrl correct" onclick="studyWrong()">💡 Review Wrong Only</button>
          </div>
        </div>`;
      return;
    }

    const card = deck.cards[currentCardIdx];
    area.innerHTML = `
      <div class="score-bar">
        <div class="score-pill g">✓ ${score.correct}</div>
        <div class="score-pill r">✗ ${score.wrong}</div>
        <span style="font-size:13px;color:var(--muted);margin-left:4px">Card ${currentCardIdx + 1} of ${total}</span>
      </div>
      <div class="card-container" onclick="flipCard()" id="cardContainer">
        <div class="card-inner" id="cardInner">
          <div class="card-face card-front">
            <div class="card-label">Question</div>
            <div class="card-text">${card.q}</div>
            <div class="card-hint">Tap to reveal answer</div>
          </div>
          <div class="card-face card-back">
            <div class="card-label">Answer</div>
            <div class="card-text">${card.a}</div>
          </div>
        </div>
      </div>
      <div class="flip-hint">
        Press <kbd>Space</kbd> to flip · <kbd>→</kbd> correct · <kbd>←</kbd> wrong
      </div>
      <div class="controls">
        <button class="btn-ctrl wrong" id="wrongBtn" onclick="markCard(false)" disabled>✗ Wrong</button>
        <button class="btn-ctrl" onclick="flipCard()">↩ Flip</button>
        <button class="btn-ctrl correct" id="correctBtn" onclick="markCard(true)" disabled>✓ Correct</button>
      </div>`;
    isFlipped = false;
  }

  function flipCard() {
    const inner = document.getElementById('cardInner');
    if (!inner) return;
    isFlipped = !isFlipped;
    inner.classList.toggle('flipped', isFlipped);
    document.getElementById('wrongBtn').disabled = !isFlipped;
    document.getElementById('correctBtn').disabled = !isFlipped;
  }

  function markCard(correct) {
    if (!isFlipped) return;
    if (correct) score.correct++; else score.wrong++;
    currentCardIdx++;
    renderStudy();
  }

  function studyWrong() {
    // Simple: just restart (could be enhanced to filter wrong cards)
    loadDeck(currentDeckIdx);
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    if (e.key === ' ') { e.preventDefault(); flipCard(); }
    if (e.key === 'ArrowRight' && isFlipped) markCard(true);
    if (e.key === 'ArrowLeft' && isFlipped) markCard(false);
  });
</script>
</body>
</html>
